<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520" role="img" aria-label="Architecture of the Jenie Helpdesk AI platform. A delivery path runs from a developer push through GitHub Actions, which lints, tests, scans with Trivy and gates on a retrieval evaluation, then pushes images to Artifact Registry and deploys a canary revision to Cloud Run. A serving path runs from the internet through Cloud Armor to the Cloud Run API, which reads from Cloud SQL with pgvector and caches in Memorystore. An indexing path runs from Cloud Scheduler through a Cloud Run Job that reads markdown documents and upserts embeddings into the same database. The API is scraped by Managed Service for Prometheus, which drives alert rules and a Grafana dashboard.">
  <rect width="1060" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 z" fill="#656d76"/>
    </marker>
    <marker id="b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 z" fill="#0969da"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- band labels -->
    <g fill="#8c959f" font-size="10" letter-spacing="1.4">
      <text x="24" y="40">DELIVERY</text>
      <text x="24" y="162">SERVING</text>
      <text x="24" y="288">INDEXING</text>
      <text x="880" y="162">OBSERVABILITY</text>
    </g>

    <!-- ============ DELIVERY ============ -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="24"  y="56" width="150" height="52" rx="6"/>
      <rect x="206" y="56" width="240" height="52" rx="6"/>
      <rect x="478" y="56" width="170" height="52" rx="6"/>
      <rect x="680" y="56" width="220" height="52" rx="6"/>
    </g>
    <g fill="#1f2328" font-size="13" text-anchor="middle">
      <text x="99"  y="79">Developer</text>
      <text x="326" y="76">GitHub Actions</text>
      <text x="563" y="79">Artifact Registry</text>
      <text x="790" y="76">Cloud Run deploy</text>
    </g>
    <g fill="#656d76" font-size="10.5" text-anchor="middle">
      <text x="99"  y="95">push to main</text>
      <text x="326" y="93">lint · tests · Trivy · eval gate</text>
      <text x="563" y="95">image + commit SHA tags</text>
      <text x="790" y="93">canary 10% → promote</text>
    </g>

    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <line x1="174" y1="82" x2="200" y2="82"/>
      <line x1="446" y1="82" x2="472" y2="82"/>
      <line x1="648" y1="82" x2="674" y2="82"/>
      <polyline points="790,108 790,138 498,138 498,170"/>
    </g>
    <g fill="#656d76" font-size="10.5" text-anchor="middle">
      <text x="563" y="48">push only after scan passes</text>
      <text x="644" y="132">new revision</text>
    </g>

    <!-- ============ SERVING ============ -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="24"  y="176" width="150" height="52" rx="6"/>
      <rect x="206" y="176" width="160" height="52" rx="6"/>
    </g>
    <rect x="398" y="176" width="200" height="52" rx="6" stroke="#0969da" stroke-width="1.6" fill="#ddf4ff"/>

    <g fill="#1f2328" font-size="13" text-anchor="middle">
      <text x="99"  y="199">Client</text>
      <text x="286" y="196">Cloud Armor</text>
      <text x="498" y="196">Cloud Run: api</text>
    </g>
    <g fill="#656d76" font-size="10.5" text-anchor="middle">
      <text x="99"  y="215">POST /ask</text>
      <text x="286" y="213">rate limit · WAF</text>
    </g>
    <text x="498" y="213" fill="#0969da" font-size="10.5" text-anchor="middle">FastAPI · /metrics</text>

    <g stroke="#0969da" stroke-width="1.6" fill="none" marker-end="url(#b)">
      <line x1="174" y1="202" x2="200" y2="202"/>
      <line x1="366" y1="202" x2="392" y2="202"/>
      <line x1="498" y1="228" x2="498" y2="294"/>
    </g>
    <text x="508" y="264" fill="#0969da" font-size="10.5">vector search</text>

    <!-- api to redis -->
    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <polyline points="598,214 705,214 705,294"/>
    </g>
    <text x="715" y="250" fill="#656d76" font-size="10.5">cache</text>

    <!-- api scraped -->
    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <line x1="598" y1="190" x2="874" y2="190"/>
    </g>
    <text x="736" y="182" fill="#656d76" font-size="10.5" text-anchor="middle">scrape /metrics</text>

    <!-- ============ STATE ============ -->
    <rect x="398" y="300" width="200" height="58" rx="6" stroke="#0969da" stroke-width="1.6" fill="#ddf4ff"/>
    <rect x="630" y="300" width="150" height="58" rx="6" stroke="#d0d7de" fill="#f6f8fa"/>

    <text x="498" y="322" fill="#1f2328" font-size="13" text-anchor="middle">Cloud SQL</text>
    <text x="498" y="338" fill="#0969da" font-size="10.5" text-anchor="middle">Postgres + pgvector</text>
    <text x="498" y="352" fill="#656d76" font-size="10" text-anchor="middle">private IP · HNSW index</text>

    <text x="705" y="325" fill="#1f2328" font-size="13" text-anchor="middle">Memorystore</text>
    <text x="705" y="341" fill="#656d76" font-size="10.5" text-anchor="middle">Redis, optional</text>

    <!-- ============ INDEXING ============ -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="24"  y="300" width="140" height="58" rx="6"/>
      <rect x="190" y="300" width="150" height="58" rx="6"/>
      <rect x="190" y="418" width="150" height="46" rx="6"/>
    </g>
    <g fill="#1f2328" font-size="13" text-anchor="middle">
      <text x="94"  y="325">Cloud Scheduler</text>
      <text x="265" y="322">Cloud Run Job</text>
      <text x="265" y="440">/data</text>
    </g>
    <g fill="#656d76" font-size="10.5" text-anchor="middle">
      <text x="94"  y="341">02:00 ICT</text>
      <text x="265" y="338">worker · idempotent</text>
      <text x="265" y="455">12 markdown docs</text>
    </g>

    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <line x1="164" y1="329" x2="184" y2="329"/>
      <line x1="265" y1="418" x2="265" y2="364"/>
      <line x1="340" y1="329" x2="392" y2="329"/>
    </g>
    <g fill="#656d76" font-size="10.5">
      <text x="275" y="396">read</text>
      <text x="366" y="322" text-anchor="middle">upsert</text>
    </g>

    <!-- ============ OBSERVABILITY ============ -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="880" y="176" width="156" height="52" rx="6"/>
      <rect x="880" y="300" width="156" height="58" rx="6"/>
    </g>
    <text x="958" y="196" fill="#1f2328" font-size="13" text-anchor="middle">Prometheus</text>
    <text x="958" y="213" fill="#656d76" font-size="10.5" text-anchor="middle">managed service</text>

    <text x="958" y="322" fill="#1f2328" font-size="13" text-anchor="middle">Alerts + Grafana</text>
    <text x="958" y="338" fill="#656d76" font-size="10.5" text-anchor="middle">4 rules · 1 dashboard</text>
    <text x="958" y="352" fill="#656d76" font-size="10" text-anchor="middle">error rate · p95 · cost</text>

    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <line x1="958" y1="228" x2="958" y2="294"/>
    </g>
    <text x="968" y="264" fill="#656d76" font-size="10.5">evaluate</text>

    <!-- footnote -->
    <text x="24" y="498" fill="#8c959f" font-size="10.5">Blue marks the request path that /ask depends on. Everything crosses a private VPC; Cloud SQL has no public IP.</text>
  </g>
</svg>
