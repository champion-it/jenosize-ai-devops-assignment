<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-label="Architecture of the Jenie Helpdesk AI platform on AWS. A delivery path runs from a developer push through GitHub Actions, which lints, tests, scans with Trivy and gates on a retrieval evaluation, then pushes images to ECR and starts a canary. A serving path runs from clients through an Application Load Balancer into the API pods on EKS Fargate, which read from RDS Postgres with pgvector and cache in ElastiCache. An indexing path runs from a Kubernetes CronJob that reads markdown documents and upserts embeddings into the same database. Metrics are written to Amazon Managed Prometheus, which drives the burn-rate alerts and is also queried by Argo Rollouts to decide whether each canary step may proceed.">
  <rect width="1080" height="560" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 z" fill="#656d76"/>
    </marker>
    <marker id="b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 z" fill="#0969da"/>
    </marker>
    <marker id="c" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <g fill="#8c959f" font-size="10" letter-spacing="1.4">
      <text x="24" y="40">DELIVERY</text>
      <text x="24" y="168">SERVING — EKS FARGATE</text>
      <text x="24" y="316">INDEXING</text>
      <text x="952" y="168">OBSERVABILITY</text>
    </g>

    <!-- DELIVERY -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="24"  y="56" width="140" height="52" rx="6"/>
      <rect x="196" y="56" width="230" height="52" rx="6"/>
      <rect x="458" y="56" width="150" height="52" rx="6"/>
    </g>
    <rect x="640" y="56" width="210" height="52" rx="6" stroke="#bc4c00" stroke-width="1.6" fill="#fff1e5"/>

    <g fill="#1f2328" font-size="13" text-anchor="middle">
      <text x="94"  y="79">Developer</text>
      <text x="311" y="76">GitHub Actions</text>
      <text x="533" y="79">ECR</text>
      <text x="745" y="76">Argo Rollouts</text>
    </g>
    <g fill="#656d76" font-size="10.5" text-anchor="middle">
      <text x="94"  y="95">push to main</text>
      <text x="311" y="93">lint · tests · Trivy · eval gate</text>
      <text x="533" y="95">scanned on push</text>
    </g>
    <text x="745" y="93" fill="#bc4c00" font-size="10.5" text-anchor="middle">canary 10 → 25 → 50 → 100%</text>

    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <line x1="164" y1="82" x2="190" y2="82"/>
      <line x1="426" y1="82" x2="452" y2="82"/>
      <line x1="608" y1="82" x2="634" y2="82"/>
    </g>
    <text x="533" y="48" fill="#656d76" font-size="10.5" text-anchor="middle">push only after the scan passes</text>

    <!-- Argo drives the rollout -->
    <g stroke="#bc4c00" stroke-width="1.6" fill="none" marker-end="url(#c)">
      <polyline points="745,108 745,140 520,140 520,180"/>
    </g>
    <text x="640" y="134" fill="#bc4c00" font-size="10.5" text-anchor="middle">shifts weight</text>

    <!-- SERVING -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="24"  y="186" width="140" height="52" rx="6"/>
      <rect x="196" y="186" width="160" height="52" rx="6"/>
    </g>
    <rect x="420" y="186" width="200" height="52" rx="6" stroke="#0969da" stroke-width="1.6" fill="#ddf4ff"/>

    <g fill="#1f2328" font-size="13" text-anchor="middle">
      <text x="94"  y="209">Client</text>
      <text x="276" y="206">ALB + WAF</text>
      <text x="520" y="206">API pods</text>
    </g>
    <g fill="#656d76" font-size="10.5" text-anchor="middle">
      <text x="94"  y="225">POST /ask</text>
      <text x="276" y="223">weighted target groups</text>
    </g>
    <text x="520" y="223" fill="#0969da" font-size="10.5" text-anchor="middle">stable + canary</text>

    <g stroke="#0969da" stroke-width="1.6" fill="none" marker-end="url(#b)">
      <line x1="164" y1="212" x2="190" y2="212"/>
      <line x1="356" y1="212" x2="414" y2="212"/>
      <line x1="520" y1="238" x2="520" y2="302"/>
    </g>
    <text x="530" y="274" fill="#0969da" font-size="10.5">vector search</text>

    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <polyline points="620,224 700,224 700,302"/>
      <line x1="620" y1="200" x2="840" y2="200"/>
    </g>
    <text x="710" y="266" fill="#656d76" font-size="10.5">cache</text>
    <text x="730" y="192" fill="#656d76" font-size="10.5" text-anchor="middle">remote write</text>

    <!-- STATE -->
    <rect x="420" y="308" width="200" height="58" rx="6" stroke="#0969da" stroke-width="1.6" fill="#ddf4ff"/>
    <rect x="648" y="308" width="150" height="58" rx="6" stroke="#d0d7de" fill="#f6f8fa"/>

    <text x="520" y="330" fill="#1f2328" font-size="13" text-anchor="middle">RDS PostgreSQL</text>
    <text x="520" y="346" fill="#0969da" font-size="10.5" text-anchor="middle">pgvector</text>
    <text x="520" y="360" fill="#656d76" font-size="10" text-anchor="middle">private subnet · no public IP</text>

    <text x="723" y="333" fill="#1f2328" font-size="13" text-anchor="middle">ElastiCache</text>
    <text x="723" y="349" fill="#656d76" font-size="10.5" text-anchor="middle">Redis, optional</text>

    <!-- INDEXING -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="24"  y="308" width="140" height="58" rx="6"/>
      <rect x="190" y="308" width="152" height="58" rx="6"/>
      <rect x="190" y="424" width="152" height="46" rx="6"/>
    </g>
    <g fill="#1f2328" font-size="13" text-anchor="middle">
      <text x="94"  y="332">CronJob</text>
      <text x="266" y="330">Indexer pod</text>
      <text x="266" y="446">/data</text>
    </g>
    <g fill="#656d76" font-size="10.5" text-anchor="middle">
      <text x="94"  y="348">03:00 ICT</text>
      <text x="266" y="346">idempotent</text>
      <text x="266" y="461">12 markdown docs</text>
    </g>

    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <line x1="164" y1="337" x2="184" y2="337"/>
      <line x1="266" y1="424" x2="266" y2="372"/>
      <line x1="342" y1="337" x2="414" y2="337"/>
    </g>
    <g fill="#656d76" font-size="10.5">
      <text x="276" y="402">read</text>
      <text x="378" y="330" text-anchor="middle">upsert</text>
    </g>

    <!-- OBSERVABILITY -->
    <g stroke="#d0d7de" fill="#f6f8fa">
      <rect x="846" y="186" width="200" height="52" rx="6"/>
      <rect x="846" y="308" width="200" height="58" rx="6"/>
    </g>
    <text x="946" y="206" fill="#1f2328" font-size="13" text-anchor="middle">Managed Prometheus</text>
    <text x="946" y="223" fill="#656d76" font-size="10.5" text-anchor="middle">SLI recording rules</text>

    <text x="946" y="330" fill="#1f2328" font-size="13" text-anchor="middle">Burn-rate alerts</text>
    <text x="946" y="346" fill="#656d76" font-size="10.5" text-anchor="middle">14.4x pages · 3x tickets</text>
    <text x="946" y="360" fill="#656d76" font-size="10" text-anchor="middle">Alertmanager → SNS</text>

    <g stroke="#656d76" stroke-width="1.4" fill="none" marker-end="url(#a)">
      <line x1="946" y1="238" x2="946" y2="302"/>
    </g>
    <text x="956" y="274" fill="#656d76" font-size="10.5">evaluate</text>

    <!-- the loop that matters: Argo queries the same SLIs -->
    <g stroke="#bc4c00" stroke-width="1.6" fill="none" marker-end="url(#c)" stroke-dasharray="5 3">
      <polyline points="900,186 900,130 862,130 862,82 856,82"/>
    </g>
    <text x="908" y="152" fill="#bc4c00" font-size="10.5">queries the same SLIs</text>

    <text x="24" y="508" fill="#8c959f" font-size="10.5">Blue is the request path. Orange is progressive delivery: Argo Rollouts shifts traffic, then reads the same recorded SLIs the alerts fire on</text>
    <text x="24" y="524" fill="#8c959f" font-size="10.5">and aborts the canary itself if availability, latency or retrieval quality degrade. Nothing holding data has a route from the internet.</text>
  </g>
</svg>
