name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is read-only. id-token is needed for Workload Identity
# Federation so no service account key ever exists.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov=common --cov=api --cov=worker --cov-report=term-missing

  dependency-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  integration:
    name: Integration and retrieval evaluation
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build postgres redis api

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz >/dev/null; then
              echo "ready after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become ready"
          docker compose logs api
          exit 1

      - name: Index the knowledge base
        run: docker compose run --rm worker --path /data

      - name: Retrieval evaluation gate
        run: |
          python3 scripts/eval.py \
            --base-url http://localhost:8000 \
            --min-pass-rate 0.8 \
            --max-p95-ms 2000

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    name: Build, scan and push images
    runs-on: ubuntu-latest
    needs: [lint, test, dependency-scan, integration]
    # Images are only published from main. Pull requests build but do not push.
    # Skipped until the Google Cloud repository variables are set, so a
    # checkout without them still shows a green pipeline rather than a
    # wall of credential failures. Setting the variables activates this
    # job; no change here is needed.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.GCP_PROJECT_ID != ''
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Derive version tag
        id: version
        run: echo "tag=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: local/${{ matrix.service }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.service }}:${{ steps.version.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        # Pushed only after the scan passes, so a vulnerable image never
        # reaches the registry where a deploy could pick it up.
        run: |
          REGISTRY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/jenie"
          SRC="local/${{ matrix.service }}:${{ steps.version.outputs.tag }}"
          docker tag "$SRC" "$REGISTRY/${{ matrix.service }}:${{ steps.version.outputs.tag }}"
          docker tag "$SRC" "$REGISTRY/${{ matrix.service }}:sha-${GITHUB_SHA::12}"
          docker push --all-tags "$REGISTRY/${{ matrix.service }}"
