name: deploy

# Dev takes the release directly. Prod goes out as a canary that Argo
# Rollouts judges against the service level indicators and aborts on its
# own if they degrade - see docs/slo.md.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: Image tag to deploy
        required: true

permissions:
  contents: read
  # Required to exchange the GitHub token for AWS credentials. There is no
  # access key anywhere in this repository or in its secrets.
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  CHART_PATH: infra/k8s

jobs:
  deploy-dev:
    name: Deploy to dev
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        # Values reach the shell through the environment, never through
        # expression interpolation into the script body: a tag containing
        # shell metacharacters would otherwise be executed rather than read.
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            SHA="${RUN_SHA:-$FALLBACK_SHA}"
            TAG="sha-$(printf '%s' "$SHA" | cut -c1-12)"
          fi
          if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9._-]{1,128}$'; then
            echo "::error::refusing to deploy an image tag with unexpected characters"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Connect to the cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Deploy
        run: |
          helm upgrade --install jenie "$CHART_PATH" \
            --namespace jenie-dev \
            --create-namespace \
            -f "$CHART_PATH/values-dev.yaml" \
            --set image.registry="${{ vars.ECR_REGISTRY }}/jenie" \
            --set image.api.tag="${{ steps.resolve.outputs.tag }}" \
            --set image.worker.tag="${{ steps.resolve.outputs.tag }}" \
            --wait --timeout 10m

      - name: Smoke test
        run: |
          kubectl -n jenie-dev rollout status deploy/jenie-helpdesk-ai-dev-api --timeout=5m
          kubectl -n jenie-dev port-forward svc/jenie-helpdesk-ai-dev-api 8000:80 &
          sleep 5
          curl -fsS localhost:8000/healthz
          python3 scripts/eval.py --base-url http://localhost:8000 --min-pass-rate 0.8

  deploy-prod:
    name: Deploy to prod (canary)
    needs: deploy-dev
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Carries a required reviewer, so this waits for a human before any
    # production traffic moves.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Connect to the cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Install the rollouts plugin
        run: |
          curl -sSLo /usr/local/bin/kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          chmod +x /usr/local/bin/kubectl-argo-rollouts

      - name: Start the canary
        # helm does not wait here on purpose. The Rollout is meant to pause
        # at each weight while the analysis runs; waiting for it to be
        # "ready" would either time out or mask the point of the exercise.
        run: |
          helm upgrade --install jenie "$CHART_PATH" \
            --namespace jenie-prod \
            --create-namespace \
            -f "$CHART_PATH/values-prod.yaml" \
            --set image.registry="${{ vars.ECR_REGISTRY }}/jenie" \
            --set image.api.tag="${{ needs.deploy-dev.outputs.image_tag }}" \
            --set image.worker.tag="${{ needs.deploy-dev.outputs.image_tag }}"

      - name: Watch it to completion
        id: watch
        # Exits non-zero if the analysis aborts the canary, which fails this
        # job. Argo has already shifted traffic back by then; the failure is
        # the report, not the remedy.
        run: |
          kubectl argo rollouts status jenie-helpdesk-ai-prod-api \
            --namespace jenie-prod \
            --timeout 20m

      - name: Report what the analysis decided
        if: always()
        run: |
          kubectl argo rollouts get rollout jenie-helpdesk-ai-prod-api \
            --namespace jenie-prod --no-color || true
          echo "--- analysis runs ---"
          kubectl -n jenie-prod get analysisrun \
            -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,MESSAGE:.status.message \
            || true

      - name: Abort explicitly if the watch failed for another reason
        if: failure()
        # The analysis aborts on its own. This covers a timeout or a
        # cancelled job, where the Rollout would otherwise sit paused with
        # traffic split.
        run: |
          kubectl argo rollouts abort jenie-helpdesk-ai-prod-api \
            --namespace jenie-prod || true
          kubectl argo rollouts undo jenie-helpdesk-ai-prod-api \
            --namespace jenie-prod || true
