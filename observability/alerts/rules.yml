groups:
  # ---------------------------------------------------------------------
  # Recording rules
  #
  # The burn-rate alerts below each compare two windows, so the same ratio
  # is needed at seven different lengths. Recording them once keeps the
  # alert expressions short enough to read and the evaluation cheap.
  #
  # clamp_min guards the denominator: with no traffic the ratio would be
  # 0/0, and an alert that fires because nothing is happening is worse than
  # no alert at all.
  # ---------------------------------------------------------------------
  - name: jenie-sli
    interval: 30s
    rules:
      - record: jenie:availability_error_ratio:5m
        expr: |
          (sum(rate(http_requests_total{status="5xx"}[5m])) or vector(0))
          / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
      - record: jenie:availability_error_ratio:30m
        expr: |
          (sum(rate(http_requests_total{status="5xx"}[30m])) or vector(0))
          / clamp_min(sum(rate(http_requests_total[30m])), 1e-9)
      - record: jenie:availability_error_ratio:1h
        expr: |
          (sum(rate(http_requests_total{status="5xx"}[1h])) or vector(0))
          / clamp_min(sum(rate(http_requests_total[1h])), 1e-9)
      - record: jenie:availability_error_ratio:2h
        expr: |
          (sum(rate(http_requests_total{status="5xx"}[2h])) or vector(0))
          / clamp_min(sum(rate(http_requests_total[2h])), 1e-9)
      - record: jenie:availability_error_ratio:6h
        expr: |
          (sum(rate(http_requests_total{status="5xx"}[6h])) or vector(0))
          / clamp_min(sum(rate(http_requests_total[6h])), 1e-9)
      - record: jenie:availability_error_ratio:1d
        expr: |
          (sum(rate(http_requests_total{status="5xx"}[1d])) or vector(0))
          / clamp_min(sum(rate(http_requests_total[1d])), 1e-9)
      - record: jenie:availability_error_ratio:3d
        expr: |
          (sum(rate(http_requests_total{status="5xx"}[3d])) or vector(0))
          / clamp_min(sum(rate(http_requests_total[3d])), 1e-9)

      # Latency SLI, as the proportion of /ask requests that were NOT served
      # within the 2 second threshold. Expressed as "bad over total" so it
      # shares the burn-rate arithmetic with availability.
      - record: jenie:latency_error_ratio:5m
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{route="/ask"}[5m]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="/ask",le="2.0"}[5m]))
          )
          / clamp_min(sum(rate(http_request_duration_seconds_count{route="/ask"}[5m])), 1e-9)
      - record: jenie:latency_error_ratio:1h
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{route="/ask"}[1h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="/ask",le="2.0"}[1h]))
          )
          / clamp_min(sum(rate(http_request_duration_seconds_count{route="/ask"}[1h])), 1e-9)
      - record: jenie:latency_error_ratio:6h
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{route="/ask"}[6h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="/ask",le="2.0"}[6h]))
          )
          / clamp_min(sum(rate(http_request_duration_seconds_count{route="/ask"}[6h])), 1e-9)
      - record: jenie:latency_error_ratio:30m
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{route="/ask"}[30m]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="/ask",le="2.0"}[30m]))
          )
          / clamp_min(sum(rate(http_request_duration_seconds_count{route="/ask"}[30m])), 1e-9)
      - record: jenie:availability_budget_consumed:30d
        expr: |
          (
            (sum(increase(http_requests_total{status="5xx"}[30d])) or vector(0))
            / clamp_min(sum(increase(http_requests_total[30d])), 1)
          ) / 0.01

  # ---------------------------------------------------------------------
  # Burn-rate alerts
  #
  # A static "error rate above 5 percent" threshold fires at the same point
  # whether the service has been failing for thirty seconds or thirty
  # minutes, and says nothing about whether the month is still recoverable.
  # These fire on how fast the error budget is being spent instead.
  #
  # Each alert needs a long window and a short one to agree. The long window
  # sets the severity; the short one makes the alert stop quickly once the
  # problem does, so a five minute outage does not hold a page open for an
  # hour.
  #
  # Budget: 1% of requests over 30 days. Burn rate 1 spends it exactly on
  # schedule; 14.4 spends 2% of a 30-day budget in one hour.
  # ---------------------------------------------------------------------
  - name: jenie-availability-slo
    interval: 30s
    rules:
      - alert: AvailabilityBudgetBurnFast
        expr: |
          jenie:availability_error_ratio:1h > (14.4 * 0.01)
          and
          jenie:availability_error_ratio:5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
          slo: availability
          page: "true"
        annotations:
          summary: "Burning the availability budget 14.4x faster than sustainable"
          description: >-
            At this rate the entire 30-day error budget is gone in about two
            days. Check which revision is serving; if a release is in
            flight, shift traffic back to the previous one.

      - alert: AvailabilityBudgetBurnMedium
        expr: |
          jenie:availability_error_ratio:6h > (6 * 0.01)
          and
          jenie:availability_error_ratio:30m > (6 * 0.01)
        for: 15m
        labels:
          severity: critical
          slo: availability
          page: "true"
        annotations:
          summary: "Burning the availability budget 6x faster than sustainable"
          description: >-
            Slower than a hard outage and easy to miss, but the budget is
            gone in about five days if it continues.

      - alert: AvailabilityBudgetBurnSlow
        expr: |
          jenie:availability_error_ratio:1d > (3 * 0.01)
          and
          jenie:availability_error_ratio:2h > (3 * 0.01)
        for: 1h
        labels:
          severity: warning
          slo: availability
          page: "false"
        annotations:
          summary: "Availability budget burning 3x faster than sustainable"
          description: "Raise a ticket. This does not need waking anyone."

      - alert: AvailabilityBudgetBurnVerySlow
        expr: |
          jenie:availability_error_ratio:3d > (1 * 0.01)
          and
          jenie:availability_error_ratio:6h > (1 * 0.01)
        for: 3h
        labels:
          severity: warning
          slo: availability
          page: "false"
        annotations:
          summary: "Availability budget will not last the window"
          description: >-
            Spending faster than the budget replenishes. Nothing is broken
            right now, but the month ends out of budget unless this changes.

      - alert: AvailabilityBudgetExhausted
        expr: jenie:availability_budget_consumed:30d >= 1
        for: 5m
        labels:
          severity: warning
          slo: availability
          page: "false"
        annotations:
          summary: "30-day availability error budget is spent"
          description: >-
            Per the policy in docs/slo.md, feature releases pause and the
            next work is reliability until the window recovers.

  - name: jenie-latency-slo
    interval: 30s
    rules:
      - alert: LatencyBudgetBurnFast
        expr: |
          jenie:latency_error_ratio:1h > (14.4 * 0.01)
          and
          jenie:latency_error_ratio:5m > (14.4 * 0.01)
        for: 5m
        labels:
          severity: critical
          slo: latency
          page: "true"
        annotations:
          summary: "Burning the latency budget 14.4x faster than sustainable"
          description: >-
            Compare rag_retrieval_duration_seconds against
            rag_answer_duration_seconds to see whether the vector search or
            the model is responsible, then open a trace for a slow request.

      - alert: LatencyBudgetBurnSlow
        expr: |
          jenie:latency_error_ratio:6h > (3 * 0.01)
          and
          jenie:latency_error_ratio:30m > (3 * 0.01)
        for: 30m
        labels:
          severity: warning
          slo: latency
          page: "false"
        annotations:
          summary: "Latency budget burning 3x faster than sustainable"
          description: "Raise a ticket. Likely a gradual regression, not an incident."

  # ---------------------------------------------------------------------
  # Operational alerts
  #
  # Not SLO-based. These catch conditions a user-facing SLI cannot see,
  # which is why they are kept separate rather than folded in above.
  # ---------------------------------------------------------------------
  - name: jenie-operational
    interval: 30s
    rules:
      - alert: ApiDown
        expr: up{job="jenie-api"} == 0
        for: 2m
        labels:
          severity: critical
          page: "true"
        annotations:
          summary: "API is not being scraped"
          description: >-
            Prometheus cannot reach the metrics endpoint. With no traffic
            reaching the service, the SLI ratios go quiet rather than bad,
            so this is the alert that catches a total outage.

      - alert: RetrievalQualityDrop
        expr: |
          sum(rate(rag_empty_retrieval_total[15m]))
          / clamp_min(sum(rate(http_requests_total{route="/ask"}[15m])), 1e-9) > 0.2
        for: 15m
        labels:
          severity: warning
          page: "false"
        annotations:
          summary: "More than 20 percent of queries retrieve nothing"
          description: >-
            Every request still succeeds, so no SLO notices. Either the
            index is stale or the questions being asked have drifted away
            from the corpus. Check the last successful indexer run.

      - alert: AiCostSpike
        expr: |
          sum(rate(llm_cost_usd_total[1h]))
          > 3 * sum(rate(llm_cost_usd_total[1h] offset 1d))
        for: 30m
        labels:
          severity: warning
          page: "false"
        annotations:
          summary: "AI spend is three times yesterday's rate"
          description: >-
            Cost per request is a success metric in its own right. A spike
            is usually abuse, a retry loop, or a prompt that grew.
