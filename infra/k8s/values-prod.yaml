environment: prod

namespace:
  create: true
  name: jenie-prod

externalSecret:
  enabled: true
  remoteKey: jenie-prod-database-url

api:
  replicas: 3
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 1Gi }

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

config:
  logLevel: INFO
  rateLimitPerMinute: 60
  otelEndpoint: http://opentelemetry-collector.observability:4318

networkPolicy:
  databaseCIDR: 10.30.0.0/24

ingress:
  enabled: true
  host: jenie.example.com

serviceMonitor:
  enabled: true
