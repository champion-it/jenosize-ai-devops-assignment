{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jenie.serviceAccountName" . }}
  labels:
    {{- include "jenie.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No pod needs to talk to the API server, so the token is not mounted.
automountServiceAccountToken: false
{{- end }}
