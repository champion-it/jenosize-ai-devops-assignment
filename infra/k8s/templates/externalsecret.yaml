{{- if .Values.externalSecret.enabled }}
# Requires the External Secrets Operator.
#
# The alternative is kubectl create secret, which puts the credential in a
# shell history and leaves a long-lived copy in etcd that every cluster
# backup then carries. This pulls it from the real secret manager on a
# refresh interval instead, so rotation upstream propagates on its own.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.existingSecret }}
  labels:
    {{- include "jenie.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef }}
    kind: SecretStore
  target:
    name: {{ .Values.database.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.database.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
