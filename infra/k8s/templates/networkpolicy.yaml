{{- if .Values.networkPolicy.enabled }}
# Default deny for everything carrying this chart's labels. Each policy below
# re-opens exactly one path, so a new workload is isolated until someone says
# otherwise rather than reachable until someone notices.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jenie.fullname" . }}-default-deny
  labels:
    {{- include "jenie.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jenie.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jenie.fullname" . }}-api
  labels:
    {{- include "jenie.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jenie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.databaseCIDR }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
    # DNS, without which nothing resolves.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jenie.fullname" . }}-indexer
  labels:
    {{- include "jenie.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jenie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: indexer
  policyTypes: [Ingress, Egress]
  # No ingress rules at all: the indexer is a batch job and nothing should
  # ever connect to it.
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.databaseCIDR }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
