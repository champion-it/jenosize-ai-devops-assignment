{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "jenie.labels" . | nindent 4 }}
    # Pod Security Admission. The namespace is the security boundary on
    # Kubernetes, the way a VPC is on Cloud Run: anything admitted here must
    # meet this level, including workloads this chart does not own.
    pod-security.kubernetes.io/enforce: {{ .Values.namespace.podSecurityLevel }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: {{ .Values.namespace.podSecurityLevel }}
    pod-security.kubernetes.io/warn: {{ .Values.namespace.podSecurityLevel }}
{{- end }}
