{{- if not .Values.rollout.enabled }}
# The plain path: a Deployment with a rolling update.
#
# Used where Argo Rollouts is not installed, which includes a bare local
# cluster. The pod spec is shared with the Rollout, so the two differ only
# in how a new version is introduced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jenie.fullname" . }}-api
  labels:
    {{- include "jenie.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "jenie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Capacity never dips during a release, and a bad image replaces one
      # pod at a time rather than the fleet.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "jenie.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- include "jenie.apiPodSpec" . | nindent 6 }}
{{- end }}
